<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width,initial-scale=1,initial-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <script src="./static/vendor/echarts.min5.3.0_20230425.js"></script>
      <!-- websdk / emedia 官方 npm 包已下架（CDN 404），用空壳占位避免整个 bundle 抛 ReferenceError -->
    <script>
      (function () {
        function noop() {}
        function makeConn() {
          return {
            getUniqueId: function () { return Date.now() + '' },
            listen: noop, open: noop, close: noop, send: noop,
            sendPrivateMessage: noop, sendGroupMessage: noop,
            setPresence: noop, subscribe: noop, getRoster: noop,
            isOpened: function () { return false }
          }
        }
        if (typeof websdk === 'undefined') {
          window.websdk = { default: { connection: makeConn, message: function () { return { set: noop, body: {} } } } }
        }
        if (typeof emedia === 'undefined') { window.emedia = {} }
        if (typeof window.EMedia === 'undefined') { window.EMedia = {} }
      })()
    </script>
  </head>
  <body style="height: 100vh">
    <div id="app"></div>
  </body>
</html>
