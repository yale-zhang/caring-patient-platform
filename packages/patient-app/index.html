<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <meta base ="/wx/">
    <title></title>
    <!-- 注意：生产环境请将静态资源部署到自己的CDN或服务器 -->
<script src="./static/vendor/vue.min.js"></script>
    <script src="./static/vendor/axios.min.js"></script>
    <script src="./static/vendor/compressor.min.js"></script>
    <script src="./static/vendor/moment.min.js"></script>
    <script src="./static/vendor/echarts.min.js"></script>
      <!-- websdk / emedia 官方 npm 包已下架（CDN 404），用空壳占位避免整个 bundle 抛 ReferenceError -->
    <script>
      (function () {
        function noop() {}
        function makeConn() {
          return {
            getUniqueId: function () { return Date.now() + '' },
            listen: noop, open: noop, close: noop, send: noop,
            sendPrivateMessage: noop, sendGroupMessage: noop,
            setPresence: noop, subscribe: noop, getRoster: noop,
            isOpened: function () { return false }
          }
        }
        if (typeof websdk === 'undefined') {
          window.websdk = { default: { connection: makeConn, message: function () { return { set: noop, body: {} } } } }
        }
        if (typeof emedia === 'undefined') { window.emedia = {} }
        if (typeof window.EMedia === 'undefined') { window.EMedia = {} }
      })()
    </script>
  </head>

  <body style="min-height: 100vh;">
    <div id="app-box" style="background-color: #fafafa;"> </div>
  </body>
</html>
