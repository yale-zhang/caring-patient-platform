server {
        listen       10000;
        server_name  localhost;
        underscores_in_headers on;

        # Docker 内嵌 DNS：网关在请求时才解析，容器未启动/重启不会让 nginx 启动失败
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway caring-gateway-server;

        location ^~ /caring-ui {
            proxy_set_header   Host $host:$server_port;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            root /data/projects/;
            index index.html;
        }
        # Docker Compose resolves the gateway service on the caring-network.
        location /api {
            proxy_set_header   Host $host:$server_port;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            # 使用变量后 nginx 不做 URI 替换，必须显式拼 $request_uri
            proxy_pass http://$gateway:8760$request_uri;
        }

        location /nacos {
            proxy_set_header   Host $host:$server_port;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            proxy_pass http://nacos:8848/nacos;
        }

        location /zipkin {
            proxy_set_header   Host $host:$server_port;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            proxy_pass http://localhost:9411/zipkin;
        }

        location /caring-monitor {
			proxy_set_header   Host $host:$server_port;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            proxy_pass http://localhost:8762/caring-monitor;
        }

        # 文件跨域
        location /crossdomain.xml {
            alias /usr/local/nginx/html/crossdomain.xml;
        }
        # ---------- 各端前端（构建产物放在 /data/projects/<dir>） ----------
        # 患者端 H5        npm run build -w bpm-app                  -> /data/projects/wx
        location ^~ /wx/ {
            root /data/projects;
            index index.html;
            try_files $uri $uri/ /wx/index.html;
        }
        # 医生端            npm run build -w @caring/doctor-app       -> /data/projects/doctor
        location ^~ /doctor/ {
            root /data/projects;
            index index.html;
            try_files $uri $uri/ /doctor/index.html;
        }
        # 咨询端            npm run build -w @caring/consultation-app -> /data/projects/consultationDoctor
        location ^~ /consultationDoctor/ {
            root /data/projects;
            index index.html;
            try_files $uri $uri/ /consultationDoctor/index.html;
        }
        # 助手端            npm run build -w @caring/assistant-app    -> /data/projects/assistant
        location ^~ /assistant/ {
            root /data/projects;
            index index.html;
            try_files $uri $uri/ /assistant/index.html;
        }
        # 患者管理端        VITE_PUBLIC_PATH=/manage/ npm run build -w @caring/patient-manage-app -> /data/projects/manage
        location ^~ /manage/ {
            root /data/projects;
            index index.html;
            try_files $uri $uri/ /manage/index.html;
        }

        # 兼容老前端：部分接口没带 /api 前缀（如 /nursing/xxx、/tenant/xxx），补上再转网关
        location ~ ^/(nursing|ucenter|cms|msgs|tenant|file|authority|ai|gateway|sms|open)/ {
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            proxy_pass http://$gateway:8760/api$request_uri;
        }

        # 文件访问配置
        location ^~ /file {
            if ($request_uri ~* ^.*\/(.*)\.(apk|java|txt|doc|pdf|rar|gz|zip|docx|exe|xlsx|ppt|pptx|jpg|png)(\?fileName=([^&]+))$) {
                add_header Content-Disposition "attachment;filename=$arg_attname";
            }
            root /data/projects/uploadfile;
            index index.html;
        }
}
server {
        listen       180;
        server_name  localhost;
        underscores_in_headers on;

        location /caring-admin-ui {
            proxy_set_header   Host $host:$server_port;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            root /data/projects/;
            index index.html;
        }
}
