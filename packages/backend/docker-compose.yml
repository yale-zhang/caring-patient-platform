version: '3.8'

networks:
  caring-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0.25
    platform: linux/amd64
    restart: always
    container_name: caring-mysql
    security_opt:
      - seccomp:unconfined
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/my.cnf
      # 数据库初始化脚本
      - ./config/sql:/docker-entrypoint-initdb.d
    environment:
      - "MYSQL_ROOT_PASSWORD=change-this-password"
      - "MYSQL_DATABASE=nacos_config"
      - "MYSQL_MULTIPLE_DATABASES=caring_job"
      - "TZ=Asia/Shanghai"
    ports:
      - "3307:3306"
    networks:
      - caring-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-this-password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  nacos:
    image: nacos/nacos-server:1.4.1
    platform: linux/amd64
    container_name: caring-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m            # ★ 新增
      - JVM_XMX=512m            # ★ 新增
      - JVM_XMN=256m            # ★ 新增
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=change-this-password
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN_SECRET_KEY=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
    volumes:
      - ./volumes/data/nacos-logs:/home/nacos/logs
      - ./config/nacos/conf:/home/nacos/conf
      - ./config/nacos/init.d:/home/nacos/init.d
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - caring-network

  redis:
    image: redis:6.2
    platform: linux/amd64
    restart: always
    container_name: caring-redis
    volumes:
      - ./volumes/data/redsidata:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - caring-network
    command: redis-server /usr/local/etc/redis/redis.conf

  # xxl-job 分布式调度中心
  xxl-job:
    image: xuxueli/xxl-job-admin:2.3.0
    platform: linux/amd64
    restart: always
    container_name: caring-xxl-job
    environment:
      - PARAMS=--spring.config.location=/application.properties
    volumes:
      - ./volumes/data/xxl-job:/data/applogs
      - ./config/xxl-job/application.properties:/application.properties
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - caring-network

  nginx:
    image: nginx:1.21
    platform: linux/amd64
    container_name: caring-nginx
    restart: always
    depends_on:
      - caring-gateway-server
    volumes:
      - ./config/nginx/conf:/etc/nginx
      - ./config/nginx/html:/usr/share/nginx/html
      - ./volumes/data/nginx-log:/var/log/nginx
    ports:
      - "8082:10000"
     # - "443:443"
    networks:
      - caring-network

  caring-gateway-server:
    image: caring-gateway-server:local
    platform: linux/amd64
    build:
      context: ./caring-gateway/caring-gateway-server
      args:
        JAR_FILE: target/caring-gateway-server.jar
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      # Nacos 已开启鉴权(nacos.core.auth.enabled=true)，客户端必须带账号
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      # 命名空间/分组：默认值取自 src/main/filters/config-dev.properties
      # 若 Nacos 里配置实际不在该 namespace，用环境变量 NACOS_NAMESPACE 覆盖即可，无需重新打包
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      PARAMS: >-
        --spring.main.web-application-type=reactive
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:18760:8760"
    networks:
      - caring-network

  caring-authority-server:
    image: caring-authority-server:local
    platform: linux/amd64
    build:
      context: ./caring-authority/caring-authority-server
      args:
        JAR_FILE: target/caring-authority-server.jar
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      # Nacos 已开启鉴权(nacos.core.auth.enabled=true)，客户端必须带账号
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      # 命名空间/分组：默认值取自 src/main/filters/config-dev.properties
      # 若 Nacos 里配置实际不在该 namespace，用环境变量 NACOS_NAMESPACE 覆盖即可，无需重新打包
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      PARAMS: >-
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - caring-network

  caring-tenant-server:
    image: caring-tenant-server:local
    platform: linux/amd64
    build:
      context: ./caring-tenant/caring-tenant-server
      dockerfile: Dockerfile.compose
      args:
        JAR_FILE: target/caring-tenant-server.jar
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      # Nacos 已开启鉴权(nacos.core.auth.enabled=true)，客户端必须带账号
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      # 命名空间/分组：默认值取自 src/main/filters/config-dev.properties
      # 若 Nacos 里配置实际不在该 namespace，用环境变量 NACOS_NAMESPACE 覆盖即可，无需重新打包
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      PARAMS: >-
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
      caring-authority-server:
        condition: service_started
    networks:
      - caring-network

  caring-oauth-server:
    image: caring-oauth-server:local
    platform: linux/amd64
    build:
      context: ./caring-ucenter/caring-ucenter-server
      args:
        JAR_FILE: target/caring-ucenter-server.jar
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      # Nacos 已开启鉴权(nacos.core.auth.enabled=true)，客户端必须带账号
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      # 命名空间/分组：默认值取自 src/main/filters/config-dev.properties
      # 若 Nacos 里配置实际不在该 namespace，用环境变量 NACOS_NAMESPACE 覆盖即可，无需重新打包
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      SPRING_APPLICATION_NAME: caring-oauth-server
      PARAMS: >-
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
      caring-authority-server:
        condition: service_started
      caring-tenant-server:
        condition: service_started
    networks:
      - caring-network

volumes:
  mysql-data: