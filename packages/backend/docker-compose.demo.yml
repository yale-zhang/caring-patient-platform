version: '3.8'

# ============================================================
# 演示栈（demo stack）
# 与 docker-compose.yml 的差异：
#   1. 容器名统一加 demo- 前缀，不干扰宿主机已有的 caring-* 容器
#   2. 端口全部避开宿主机已占用端口（3307/8848/6381 已被遗留容器占用）
#   3. 复用同一份 config/sql 初始化脚本与 config/nacos 配置
#   4. 仅保留演示必需的中间件 + 8 个业务服务 + nginx
# ============================================================

networks:
  caring-demo-network:
    driver: bridge

x-caring-service: &caring-service
  restart: always
  environment:
    NACOS_IP: nacos
    NACOS_PORT: "8848"
    CARING_MYSQL_IP: mysql
    CARING_MYSQL_PORT: "3306"
    CARING_REDIS_IP: redis
    CARING_REDIS_PORT: "6379"
    NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
    NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
    NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
    NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
    PARAMS: >-
      --caring.nacos.ip=nacos --caring.nacos.port=8848
      --caring.mysql.ip=mysql --caring.mysql.port=3306
      --caring.redis.ip=redis --caring.redis.port=6379
  depends_on:
    mysql:
      condition: service_healthy
    nacos:
      condition: service_started
    redis:
      condition: service_started
  networks:
    - caring-demo-network

x-caring-mq-service: &caring-mq-service
  restart: always
  environment:
    NACOS_IP: nacos
    NACOS_PORT: "8848"
    CARING_MYSQL_IP: mysql
    CARING_MYSQL_PORT: "3306"
    CARING_REDIS_IP: redis
    CARING_REDIS_PORT: "6379"
    NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
    NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
    NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
    NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
    PARAMS: >-
      --caring.nacos.ip=nacos --caring.nacos.port=8848
      --caring.mysql.ip=mysql --caring.mysql.port=3306
      --caring.redis.ip=redis --caring.redis.port=6379
      --caring.rabbitmq.enabled=true
  depends_on:
    mysql:
      condition: service_healthy
    nacos:
      condition: service_started
    redis:
      condition: service_started
    rabbitmq:
      condition: service_started
  networks:
    - caring-demo-network

services:
  # ---------------- 中间件 ----------------
  mysql:
    image: mysql:8.0.25
    platform: linux/amd64
    restart: always
    container_name: demo-caring-mysql
    security_opt:
      - seccomp:unconfined
    volumes:
      - demo-mysql-data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/my.cnf
      - ./config/sql:/docker-entrypoint-initdb.d
    environment:
      - "MYSQL_ROOT_PASSWORD=change-this-password"
      - "MYSQL_DATABASE=nacos_config"
      - "MYSQL_MULTIPLE_DATABASES=caring_job"
      - "TZ=Asia/Shanghai"
    ports:
      - "13307:3306"
    networks:
      - caring-demo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-this-password"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  nacos:
    image: nacos/nacos-server:1.4.1
    platform: linux/amd64
    container_name: demo-caring-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=change-this-password
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN_SECRET_KEY=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
    volumes:
      - ./volumes/data/nacos-logs:/home/nacos/logs
      - ./config/nacos/conf:/home/nacos/conf
      - ./config/nacos/init.d:/home/nacos/init.d
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    ports:
      - "18848:8848"
      - "19848:9848"
    networks:
      - caring-demo-network

  redis:
    image: redis:6.2
    platform: linux/amd64
    restart: always
    container_name: demo-caring-redis
    volumes:
      - ./volumes/data/redsidata:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "16380:6379"
    networks:
      - caring-demo-network
    command: redis-server /usr/local/etc/redis/redis.conf

  rabbitmq:
    image: rabbitmq:3.9-management
    platform: linux/amd64
    restart: always
    container_name: demo-caring-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: caring
      RABBITMQ_DEFAULT_PASS: caring
      TZ: Asia/Shanghai
    volumes:
      - ./volumes/data/rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    networks:
      - caring-demo-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  xxl-job:
    image: xuxueli/xxl-job-admin:2.3.0
    platform: linux/amd64
    restart: always
    container_name: demo-caring-xxl-job
    environment:
      - PARAMS=--spring.config.location=/application.properties
    volumes:
      - ./volumes/data/xxl-job:/data/applogs
      - ./config/xxl-job/application.properties:/application.properties
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "18080:8080"
    networks:
      - caring-demo-network

  # ---------------- 网关 + 业务服务 ----------------
  caring-gateway-server:
    image: caring-gateway-server:local
    platform: linux/amd64
    container_name: demo-caring-gateway-server
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      PARAMS: >-
        --spring.main.web-application-type=reactive
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "18760:8760"
    networks:
      - caring-demo-network

  caring-authority-server:
    image: caring-authority-server:local
    platform: linux/amd64
    container_name: demo-caring-authority-server
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      PARAMS: >-
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "18861:8761"
    networks:
      - caring-demo-network

  caring-tenant-server:
    image: caring-tenant-server:local
    platform: linux/amd64
    container_name: demo-caring-tenant-server
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      PARAMS: >-
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "18862:8762"
    networks:
      - caring-demo-network

  caring-oauth-server:
    image: caring-oauth-server:local
    platform: linux/amd64
    container_name: demo-caring-oauth-server
    restart: always
    environment:
      NACOS_IP: nacos
      NACOS_PORT: "8848"
      CARING_MYSQL_IP: mysql
      CARING_MYSQL_PORT: "3306"
      CARING_REDIS_IP: redis
      CARING_REDIS_PORT: "6379"
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_ID: ${NACOS_NAMESPACE:-c5bec804-e4c4-11f1-a4ec-0242ac150002}
      NACOS_GROUP: ${NACOS_GROUP:-sass-cloud}
      NACOS_DISCOVERYGROUP: ${NACOS_DISCOVERYGROUP:-sass-cloud}
      PARAMS: >-
        --caring.nacos.ip=nacos --caring.nacos.port=8848
        --caring.mysql.ip=mysql --caring.mysql.port=3306
        --caring.redis.ip=redis --caring.redis.port=6379
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "18863:8763"
    networks:
      - caring-demo-network

  caring-nursing-server:
    image: caring-nursing-server:local
    platform: linux/amd64
    container_name: demo-caring-nursing-server
    restart: always
    <<: *caring-mq-service
    ports:
      - "18864:8764"
    networks:
      - caring-demo-network

  caring-cms-server:
    image: caring-cms-server:local
    platform: linux/amd64
    container_name: demo-caring-cms-server
    restart: always
    <<: *caring-mq-service
    ports:
      - "18865:8765"
    networks:
      - caring-demo-network

  caring-file-server:
    image: caring-file-server:local
    platform: linux/amd64
    container_name: demo-caring-file-server
    restart: always
    <<: *caring-mq-service
    ports:
      - "18866:8766"
    networks:
      - caring-demo-network

  caring-msgs-server:
    image: caring-msgs-server:local
    platform: linux/amd64
    container_name: demo-caring-msgs-server
    restart: always
    <<: *caring-mq-service
    ports:
      - "18867:8767"
    networks:
      - caring-demo-network

  # ---------------- 前端网关 ----------------
  nginx:
    image: nginx:1.21
    platform: linux/amd64
    container_name: demo-caring-nginx
    restart: always
    depends_on:
      - caring-gateway-server
    volumes:
      - ./config/nginx/conf:/etc/nginx
      - ./config/nginx/html:/usr/share/nginx/html
      - ./volumes/data/nginx-log:/var/log/nginx
      - ./volumes/data/projects:/data/projects
    ports:
      - "18082:10000"
    networks:
      - caring-demo-network

volumes:
  demo-mysql-data:
