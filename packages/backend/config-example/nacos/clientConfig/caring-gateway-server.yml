caring:
  log:
    enabled: false
  webmvc:
    enabled: false
  database:
    tenantDatabasePrefix: caring_extend

spring:
  autoconfigure:
    exclude: io.seata.integration.http.HttpAutoConfiguration
  cloud:
    gateway:
      x-forwarded:
        prefixEnabled: false
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: oauth
          # 注意：oauth 服务由 caring-ucenter/caring-ucenter-server 构建，
          # 其 spring.application.name 取自 artifactId = caring-ucenter-server，
          # 而非 caring-oauth-server，故此处必须指向实际注册名。
          # 注意：同一路由内多个 Path 谓词之间是 AND 关系，
          # 因此 /oauth/** 与 /ucenter/** 必须拆成两条独立路由。
          uri: lb://caring-ucenter-server
          predicates:
            - Path=/oauth/**
          filters:
            - StripPrefix=1
        - id: ucenter
          uri: lb://caring-ucenter-server
          predicates:
            - Path=/ucenter/**
          filters:
            - StripPrefix=1
        - id: nursing
          uri: lb://caring-nursing-server
          predicates:
            - Path=/nursing/**
          filters:
            - StripPrefix=1
        - id: cms
          uri: lb://caring-cms-server
          predicates:
            - Path=/cms/**
          filters:
            - StripPrefix=1
        - id: tenant
          uri: lb://caring-tenant-server
          predicates:
            - Path=/tenant/**
          filters:
            - StripPrefix=1
        - id: file
          uri: lb://caring-file-server
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        - id: authority
          uri: lb://caring-authority-server
          predicates:
            - Path=/authority/**
          filters:
            - StripPrefix=1
        - id: msgs
          uri: lb://caring-msgs-server
          predicates:
            - Path=/msgs/**
          filters:
            - StripPrefix=1
        - id: demo
          uri: lb://caring-demo-server
          predicates:
            - Path=/demo/**
          filters:
            - StripPrefix=1
        - id: order
          uri: lb://caring-order-server
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        - id: center
          uri: lb://caring-center-server
          predicates:
            - Path=/center/**
          filters:
            - StripPrefix=1
      default-filters:
        - name: Hystrix
          args:
            name: default
            fallbackUri: 'forward:/fallback'


server:
  port: 8760
  servlet:
    context-path: /api



ignore:
  token:
    baseUri:
      - /error
      - /actuator/**
      - /gate/**
      - /static/**
      - /anno/**
      - /**/anno/**
      - /**/swagger-ui.html
      - /**/doc.html
      - /**/webjars/**
      - /**/v2/api-docs/**
      - /**/v2/api-docs-ext/**
      - /**/swagger-resources/**
      - /ds/**
